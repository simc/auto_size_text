name: auto_size_text
description: Flutter widget that automatically resizes text to fit perfectly within its bounds.
version: 3.0.0
homepage: https://github.com/leisim/auto_size_text

environment:
  sdk: '>=2.19.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Setting to any will let the SDK version define
  # the most compatible version.
  leak_tracker_flutter_testing: any
